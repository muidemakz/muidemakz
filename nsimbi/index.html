  <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <script>
    // Remove caches and service workers from earlier prototype builds so a phone
    // always opens the current Profile and chat screens instead of stale copies.
    if (window.caches) caches.keys().then(keys => keys.forEach(key => caches.delete(key))).catch(() => {});
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(list => list.forEach(worker => worker.unregister())).catch(() => {});
  </script>
  <script src="./assets/pdf/pdf-lib.min.js"></script><script type="module" src="./app.mjs?v=18"></script>
