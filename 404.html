<script>
(function () {
  var pathEl = document.getElementById('nfPath');
  var path = window.location.pathname;
  var isRealMiss = path && path !== '/' && path !== '/404.html';

  if (pathEl && isRealMiss) {
    pathEl.textContent = 'You tried: ' + path;
    pathEl.hidden = false;
  }

  if (!isRealMiss) return;

  // "did you mean" — catches a typo'd or slightly-off URL (e.g. /cardtoniic,
  // /card-tonic) rather than leaving a mistyped visitor with nothing but
  // the generic actions below. Every real page on the site, matched by
  // plain Levenshtein distance against whatever slug they landed on.
  var PAGES = [
    { slug: 'index', label: 'Home', href: 'index.html' },
    { slug: 'about', label: 'About', href: 'about.html' },
    { slug: 'my-work', label: 'My Work', href: 'my-work.html' },
    { slug: 'work', label: 'My Work', href: 'my-work.html' },
    { slug: 'coreloops', label: 'Coreloops', href: 'coreloops.html' },
    { slug: 'cardtonic', label: 'Cardtonic', href: 'cardtonic.html' },
    { slug: 'teesaslms', label: 'Teesas LMS', href: 'teesaslms.html' },
    { slug: 'fundall', label: 'Fundall', href: 'fundall.html' },
    { slug: 'omnione', label: 'Omnione', href: 'omnione.html' },
    { slug: 'empty-state', label: 'Omnibiz', href: 'empty-state.html' },
    { slug: 'raven-pay', label: 'Raven Pay', href: 'raven-pay.html' },
    { slug: 'venx', label: 'VENX', href: 'venx.html' }
    // Cancel Flow intentionally left out — not finished, not meant to be
    // surfaced yet, same reasoning as the work-grid Coming Soon treatment.
  ];

  function levenshtein(a, b) {
    var m = a.length, n = b.length;
    var d = [];
    for (var i = 0; i <= m; i++) d[i] = [i];
    for (var j = 0; j <= n; j++) d[0][j] = j;
    for (i = 1; i <= m; i++) {
      for (j = 1; j <= n; j++) {
        d[i][j] = a[i - 1] === b[j - 1]
          ? d[i - 1][j - 1]
          : 1 + Math.min(d[i - 1][j - 1], d[i - 1][j], d[i][j - 1]);
      }
    }
    return d[m][n];
  }

  var tried = path.replace(/^\/+|\/+$|\.html$/g, '').toLowerCase();
  if (!tried) return;

  // a truncated/partial URL (someone stopped typing early, or a copy-paste
  // got cut off — e.g. "/cardto") is a real-world case Levenshtein alone
  // handles badly, since a missing suffix counts as several edits. Check
  // for a plain prefix match first, on either side, before falling back
  // to edit-distance for genuine typos (transposed/wrong letters).
  var best = null;
  PAGES.forEach(function (p) {
    if (best) return;
    if (tried.length >= 3 && (p.slug.indexOf(tried) === 0 || tried.indexOf(p.slug) === 0)) {
      best = p;
    }
  });

  var bestDist = 0;
  if (!best) {
    bestDist = Infinity;
    PAGES.forEach(function (p) {
      var dist = levenshtein(tried, p.slug);
      if (dist < bestDist) { bestDist = dist; best = p; }
    });
  }

  // threshold scales with length so short slugs need a near-exact miss,
  // longer ones tolerate a couple more typo'd characters
  var threshold = Math.max(2, Math.floor(tried.length * 0.4));
  if (best && (bestDist === 0 || bestDist <= threshold) && tried !== best.slug) {
    var suggestEl = document.getElementById('nfSuggest');
    var linkEl = document.getElementById('nfSuggestLink');
    if (suggestEl && linkEl) {
      linkEl.textContent = best.label;
      linkEl.href = best.href;
      suggestEl.hidden = false;
    }
  }
})();
</script>
