<style>
  /* 404 in the new design: the same header as the site, a dotted board, and a card that has lost a pin.

  :root {
    --bg: #0c0b0d; --surface: #161418; --raised: #1f1c22; --line: rgba(244, 242, 244, .12);

    --ink: #141214; --ink-soft: #4d474f; --ink-mute: #7b757d; --accent-text: #c93d00;

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    background-color: var(--bg);
    background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.4px);

  a { color: inherit; }
  .nf-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
  .pill { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); text-decoration: none; font-weight: 500; }
  .brand { font: 700 14px/1 "JetBrains Mono", monospace; letter-spacing: .02em; }
  .nav { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
  .nav a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 16px; border-radius: 999px; text-decoration: none; color: var(--ink-soft); font-weight: 500; }
  .nav a:hover { color: var(--ink); background: var(--raised); }

  .nf { flex: 1; display: grid; place-items: center; padding: 24px 16px 64px; text-align: center; }
  .nf-inner { display: grid; justify-items: center; gap: 14px; max-width: 560px; }
  .scene { position: relative; width: 300px; height: 230px; margin-bottom: 6px; }
  .pin { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 34% 30%, #fff 0 9%, var(--accent) 10% 62%, rgba(0, 0, 0, .4) 100%); box-shadow: 0 4px 7px rgba(0, 0, 0, .5); z-index: 3; }
  .pin--hold { top: 18px; left: 64px; }
  /* the card hangs from its one remaining pin and swings */
  .card {
    position: absolute; top: 26px; left: 72px;
    width: 190px; height: 150px; margin-left: -18px;
    padding: 18px 18px 14px;
    border-radius: 14px;
    background: var(--card);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
    transform-origin: 18px 0;
    animation: swing 3.4s cubic-bezier(.45, 0, .35, 1) infinite alternate;
    text-align: left;
  }
  .card b { display: block; color: var(--accent-text); font: 700 54px/1 "Outfit", sans-serif; letter-spacing: -.04em; }
  .card span { display: block; margin-top: 6px; color: var(--ink-mute); font: 500 12px/1.3 "JetBrains Mono", monospace; letter-spacing: .06em; text-transform: uppercase; }
  .card i { position: absolute; left: 18px; right: 18px; bottom: 18px; height: 6px; border-radius: 4px; background: color-mix(in srgb, var(--ink-mute) 30%, transparent); }
  .card i + i { bottom: 32px; right: 60px; }
  /* the pin that fell out, lying below with a little bounce */
  .pin--lost { left: 222px; bottom: 6px; animation: settle 3.4s ease-in-out infinite alternate; }
  .shadow { position: absolute; left: 216px; bottom: 0; width: 30px; height: 6px; border-radius: 50%; background: rgba(0, 0, 0, .35); filter: blur(2px); }
  .note { position: absolute; right: 0; top: 0; color: #f2c94c; font: 700 22px/1 "Caveat", cursive; transform: rotate(6deg); }
  html[data-theme="light"] .note { color: #8a5a00; }
  @keyframes swing { from { transform: rotate(14deg); } to { transform: rotate(4deg); } }
  @keyframes settle { 0%, 70% { transform: translateY(0) rotate(0); } 85% { transform: translateY(-6px) rotate(20deg); } 100% { transform: translateY(0) rotate(40deg); } }
  h1 { margin: 0; font: 600 clamp(28px, 6vw, 40px)/1.1 "Outfit", sans-serif; letter-spacing: -.03em; text-wrap: balance; }
  .lede { margin: 0; color: var(--ink-soft); font-size: 17px; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 6px; }
  .btn { display: inline-flex; align-items: center; min-height: 46px; padding: 0 22px; border-radius: 999px; text-decoration: none; font-weight: 600; }
  .btn--primary { background: var(--accent); color: var(--on-accent); }
  .btn--primary:hover { background: #ff8a5c; }
  .btn--quiet { border: 1px solid var(--line); background: var(--surface); }
  .btn--quiet:hover { border-color: var(--accent); }
  .try { margin: 14px 0 0; color: var(--ink-mute); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .chips a { display: inline-flex; min-height: 36px; align-items: center; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink-soft); font-size: 14px; text-decoration: none; }
  .chips a:hover { border-color: var(--accent); color: var(--ink); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (max-width: 520px) { .nav a { padding: 0 12px; } .scene { transform: scale(.85); margin: -12px 0 -18px; } }
  @media (prefers-reduced-motion: reduce) { .card, .pin--lost { animation: none; } .card { transform: rotate(9deg); } }
