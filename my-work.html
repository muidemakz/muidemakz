<!DOCTYPE html>
<html lang="en" class="pane-fit">
<head>
  <meta charset="UTF-8">
  <script src="js/to-shell.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Work &middot; Excellent Makanju, Senior Product Designer</title>
  <meta name="description" content="Case studies by Excellent Makanju, Senior Product Designer: fintech, payments, B2B systems and AI-native product building through Valideity.">
  <link rel="canonical" href="https://muidemakz.com/work">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Excellent Makanju">
  <meta property="og:title" content="My Work &middot; Excellent Makanju, Senior Product Designer">
  <meta property="og:description" content="Case studies by Excellent Makanju, Senior Product Designer: fintech, payments, B2B systems and AI-native product building through Valideity.">
  <meta property="og:url" content="https://muidemakz.com/work">
  <meta property="og:image" content="https://muidemakz.com/images/about/about-me.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Work &middot; Excellent Makanju, Senior Product Designer">
  <meta name="twitter:description" content="Case studies by Excellent Makanju, Senior Product Designer: fintech, payments, B2B systems and AI-native product building through Valideity.">
  <meta name="twitter:image" content="https://muidemakz.com/images/about/about-me.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/home-rail-preview.css">
  <link rel="stylesheet" href="css/board.css">
  <link rel="stylesheet" href="css/work-board-preview.css">
  <script>try{var d=document.documentElement,s=localStorage;if(s.getItem('ui-theme')==='light')d.setAttribute('data-theme','light');var m=s.getItem('ui-rail');if(m==='collapsed')d.classList.add('rail-collapsed');if(m==='focus')d.classList.add('focus-mode')}catch(e){}</script>
  <script src="js/embed-preview.js"></script>
</head>
<body>
  <div class="home">
    <aside class="rail" id="rail" data-active="work"></aside>
    <script src="js/rail-preview.js"></script>

    <main class="pane wb" id="work" tabindex="0" aria-label="All work, laid out on a board">
      <div class="pane-inner">
        <div class="wb-bar" role="search" aria-label="Find and filter work">
          <div class="wb-row">
            <label class="wb-search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
              <span class="sr-only">Search projects</span>
              <input id="wbSearch" type="search" placeholder="Search projects or topics" autocomplete="off" enterkeyhint="search">
              <button class="wb-clear" id="wbSearchClear" type="button" aria-label="Clear search" hidden>&times;</button>
            </label>
            <div class="wb-view" role="group" aria-label="Layout">
              <button type="button" data-view="board" aria-pressed="true">Board</button>
              <button type="button" data-view="grid" aria-pressed="false">Grid</button>
            </div>
          </div>
          <div class="wb-filters" id="wbFilters" role="group" aria-label="Filter by category"></div>
          <p class="wb-status" id="wbStatus" aria-live="polite" hidden><span id="wbStatusText"></span> <button class="wb-reset" id="wbReset" type="button">Reset</button></p>
        </div>

        <div class="wb-board" id="wbBoard">
          <div class="wb-frames" id="wbFrames"></div>
          <div class="wb-layer" id="wbLayer" aria-hidden="true"></div>
          <div class="wb-empty" id="wbEmpty" hidden>
            <div class="we-scene" aria-hidden="true">
              <span class="we-card we-card--a"><i></i><b></b><b></b></span>
              <span class="we-card we-card--b"><i></i><b></b><b></b></span>
              <span class="we-card we-card--c"><i></i><b></b><b></b></span>
              <span class="we-glass"><span class="we-lens"><em>?</em></span><span class="we-handle"></span></span>
              <span class="we-note">nope, not here</span>
            </div>
            <b class="we-title" id="wbEmptyTitle">Nothing on the board matches that.</b>
            <span class="we-sub">Try another word, or one of these:</span>
            <div class="we-try" id="wbEmptyTry"></div>
            <button class="wb-reset" id="wbEmptyReset" type="button">Reset search and filters</button>
          </div>
        </div>

        <div class="wb-tray" id="wbTray" role="group" aria-label="Sticker tray">
          <span class="wb-tray-label">Stickers</span>
          <span class="wb-tray-items" id="wbTrayItems"></span>
          <button class="wb-tray-clear" id="wbClear" type="button" hidden>Clear mine</button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/board-config.js"></script> <!-- before the board: it holds the shared stickers address -->
  <script src="js/work-board-preview.js"></script>
  <script src="js/intro-preview.js"></script>
  <script src="js/board-cursors.js"></script>
  <script src="js/board.js"></script>
</body>
</html>
