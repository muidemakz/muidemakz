<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Hand sketched LMS wireframe concepts</title>
  <desc id="desc">Four deliberately rough pencil wireframe concepts for teacher, student, parent, and school administrator views. Reconstructed for this portfolio preview, not original historical captures.</desc>
  <defs>
    <filter id="pencil" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency=".014" numOctaves="2" seed="19" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="2.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="paperGrain" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M7 13l5-.5M36 9l3 .7M56 27l4-.8M17 47l5 .6M44 61l3-.7M64 50l2 .5" stroke="#b9b3a8" stroke-width="1" opacity=".2"/>
      <circle cx="28" cy="31" r=".8" fill="#aaa398" opacity=".22"/><circle cx="61" cy="12" r=".6" fill="#aaa398" opacity=".18"/>
    </pattern>
    <style>
      .pencil-line{fill:none;stroke:#4d4a48;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
      .light-line{fill:none;stroke:#77716b;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
      .ghost-line{fill:none;stroke:#89827a;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
      .scribble{fill:#4d4a48;font:600 23px "Segoe Print","Comic Sans MS",cursive;letter-spacing:.3px}
      .note{fill:#716a63;font:500 18px "Segoe Print","Comic Sans MS",cursive}
      .lead{fill:#393632;font:600 36px "Segoe Print","Comic Sans MS",cursive}
      .rough{filter:url(#pencil)}
    </style>
    <g id="frame">
      <path class="pencil-line" d="M10 19 Q13 11 25 13 L708 10 Q720 12 718 25 L722 363 Q719 373 705 372 L18 376 Q7 373 9 360 Z"/>
      <path class="ghost-line" d="M14 23 Q18 16 29 17 L711 15 Q726 17 724 31 L727 359 Q725 367 708 368 L21 371 Q12 369 13 356 Z"/>
      <path class="light-line" d="M25 52 Q188 49 345 52 T704 50"/>
      <circle class="light-line" cx="35" cy="33" r="6"/><circle class="light-line" cx="57" cy="33" r="6"/><circle class="light-line" cx="79" cy="33" r="6"/>
    </g>
    <g id="sideNav">
      <path class="light-line" d="M26 67 Q75 64 126 67 L125 343 Q73 345 25 343 Z"/>
      <path class="ghost-line" d="M38 87 Q71 84 107 87 M38 112 Q68 109 99 112 M39 137 Q73 135 108 138"/>
      <path class="pencil-line" d="M30 158 Q76 154 120 159 L119 188 Q74 190 29 186 Z"/>
      <path class="ghost-line" d="M39 208 Q69 205 103 208 M38 233 Q78 230 110 234 M39 258 Q65 255 101 258 M38 283 Q71 280 106 283"/>
    </g>
  </defs>

  <rect width="1600" height="1080" rx="22" fill="#f0ede7"/>
  <rect width="1600" height="1080" rx="22" fill="url(#paperGrain)"/>
  <g transform="rotate(-.35 800 88)">
    <text x="55" y="75" class="lead">One learning system, four different jobs</text>
    <path class="light-line" d="M57 91 Q245 99 444 93"/>
    <text x="57" y="124" class="note">Early structure, sketched as a starting point for discussion</text>
  </g>

