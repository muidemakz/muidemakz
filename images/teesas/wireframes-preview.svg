    <path class="ghost-line" d="M185 294 Q218 291 253 295 M284 294 Q352 291 418 295 M454 294 Q499 291 540 295 M571 294 Q611 291 647 295 M185 317 Q218 314 253 318 M284 317 Q352 314 418 318 M454 317 Q499 314 540 318 M571 317 Q611 314 647 318 M185 340 Q218 337 253 341 M284 340 Q352 337 418 341 M454 340 Q499 337 540 341 M571 340 Q611 337 647 341"/>
  </g>

  <g transform="rotate(-.25 800 1010)">
    <text x="55" y="1010" class="note">rough concept sketches · four documented roles · no measured values</text>
    <path class="ghost-line" d="M58 1025 Q379 1020 689 1026"/>
  </g>
</svg>
